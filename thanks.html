<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merci — Give Lewy 2020</title><link rel="stylesheet" href="/styles.css"><style>.thanks-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}.thanks-box{max-width:720px;margin:26px auto 0}</style></head><body><main class="shell hero"><span class="kicker">GIVE LEWY 2020</span><h1 id="thanksTitle">E-mail confirmé.</h1><p id="thanksBody" class="lead">Merci. Ton e-mail est maintenant confirmé et renforce la fiabilité de ta signature.</p><div id="shareBox" class="card thanks-box"><h2>Maintenant, fais signer 3 personnes.</h2><p class="muted">Le mouvement grandit quand chaque signataire transmet la pétition à quelques proches.</p><div class="thanks-actions"><a id="wa" class="share" target="_blank" rel="noreferrer">WhatsApp</a><a id="x" class="share" target="_blank" rel="noreferrer">X / Twitter</a><button id="copy" class="share" type="button">Copier le lien</button><a class="share" href="/">Retour au site</a></div></div></main><script>const s=new URLSearchParams(location.search).get('status'),base=location.origin+'/',text='J’ai signé pour que Robert Lewandowski reçoive enfin la reconnaissance du Ballon d’Or 2020. Signe avec moi. #GiveLewy2020';if(s!=='ok'){document.getElementById('thanksTitle').textContent='Lien non valide.';document.getElementById('thanksBody').textContent='Le lien est invalide ou a déjà été utilisé.';document.getElementById('shareBox').hidden=true}else{document.getElementById('wa').href='https://wa.me/?text='+encodeURIComponent(text+' '+base);document.getElementById('x').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(base);document.getElementById('copy').addEventListener('click',async()=>{await navigator.clipboard.writeText(base);document.getElementById('copy').textContent='Lien copié ✅'})}</script></body></html>
