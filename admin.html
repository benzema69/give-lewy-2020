<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin — Give Lewy 2020</title><link rel="stylesheet" href="/styles.css"><style>body{background:#090909}.admin{padding:38px 0 80px}.admin-top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}.admin h1{font-size:clamp(36px,6vw,64px);margin:16px 0}.login{max-width:520px}.login input{margin:12px 0}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:18px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#121212}.metric strong{display:block;font-size:34px;color:var(--gold2);letter-spacing:-.05em}.metric span{color:var(--muted);font-size:12px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.panel{padding:20px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:#111}.panel h2{margin:0 0 14px;font-size:20px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);color:var(--muted)}.row strong{color:var(--text)}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:850px){.admin-grid{grid-template-columns:1fr 1fr}.panels{grid-template-columns:1fr}}@media(max-width:480px){.admin-grid{grid-template-columns:1fr}.admin-top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="shell admin"><div class="admin-top"><a class="brand" href="/">GIVE <span>LEWY</span> 2020</a><div class="admin-actions"><button id="refresh" class="share hidden" type="button">Actualiser</button><button id="logout" class="share hidden" type="button">Verrouiller</button></div></div><section id="login" class="card login"><span class="eyebrow">ADMIN PRIVÉ</span><h1>Dashboard campagne</h1><p class="muted">Uniquement des statistiques agrégées. Aucun e-mail, nom ou IP n’est affiché ici.</p><input id="token" type="password" autocomplete="off" placeholder="Token admin"><button id="connect" class="btn" type="button">OUVRIR LE DASHBOARD</button><p id="loginStatus" class="status"></p></section><section id="dashboard" class="hidden"><span class="eyebrow">LIVE CAMPAIGN DATA</span><h1>Pré-lancement</h1><p id="generated" class="small"></p><div id="metrics" class="admin-grid"></div><div class="panels"><section class="panel"><h2>14 derniers jours</h2><div id="daily" class="rows"></div></section><section class="panel"><h2>Sources</h2><div id="sources" class="rows"></div></section><section class="panel"><h2>Pays</h2><div id="countries" class="rows"></div></section><section class="panel"><h2>Langues</h2><div id="locales" class="rows"></div></section><section class="panel"><h2>Referrals</h2><div id="referrals" class="rows"></div></section><section class="panel"><h2>Risque anti-abus</h2><div id="risk" class="rows"></div></section></div></section></main><script src="/admin.js"></script></body></html>
